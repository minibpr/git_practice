<h1 style="color: red;">🔥 edit_post.html 템플릿이 적용됐습니다 🔥</h1>c
<h2>게시글 수정</h2>
<form method="POST" enctype="multipart/form-data">
    {% csrf_token %}

    <label>제목</label><br>
    <input type="text" name="title" value="{{ post.title }}"><br><br>

    <label>내용</label><br>
    <textarea name="content">{{ post.content }}</textarea><br><br>

    <h4>기존 이미지</h4>
    {% for img in images %}
        <label>
            <input type="checkbox" name="delete_images" value="{{ img.id }}">
            삭제 <img src="{{ img.image.url }}" width="150">
        </label><br>
    {% empty %}
        <p>첨부된 이미지가 없습니다.</p>
    {% endfor %}

    <h4>새 이미지 추가</h4>
    <input type="file" name="new_images" multiple><br><br>

    <button type="submit">수정 완료</button>
</form>
